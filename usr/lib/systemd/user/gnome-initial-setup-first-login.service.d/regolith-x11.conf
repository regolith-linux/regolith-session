# Ubuntu's GNOME Initial Setup wizards (first login and release upgrade) are
# built for GNOME Shell; upstream GNOME does not run them for existing users.
# In Regolith they open as a plain window on top of Regolith's own first-login
# help. Skip them in this session only: GNOME sessions still show them, and
# their stamp files in ~/.config are left alone.
[Unit]
ConditionEnvironment=!XDG_SESSION_DESKTOP=regolith-x11
