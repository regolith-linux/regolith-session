# gnome-session starts IBus for GNOME Shell, which selects the IBus engine for
# the current input source. Nothing selects an engine in the Regolith Wayland
# session, so IBus passes keys through without composing them, and X11
# applications (GTK, Chromium and Electron with Ozone X11), which use IBus by
# default, lose dead keys: ' then e gives e instead of é. Without the daemon,
# GTK composes dead keys itself, as Wayland applications already do here.
# An IBus that the user starts (for example 'ibus-daemon -drx' in the sway
# config) is not affected.
[Unit]
ConditionEnvironment=!XDG_SESSION_DESKTOP=regolith-wayland
